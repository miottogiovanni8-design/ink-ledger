name: Weekly recap

on:
  schedule:
    # 15:00 UTC Monday — an hour after weekly-rebalance.yml, so the recap
    # reflects that run's fresh numbers
    - cron: "0 15 * * 1"
  workflow_dispatch: {}

concurrency:
  # shared with daily-mark.yml and weekly-rebalance.yml — all three write
  # the same SQLite ledger / snapshot and must never run concurrently.
  group: ink-ledger-db
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run weekly recap
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m trading_desk.cli.weekly_recap

      - name: Commit updated snapshot
        run: |
          git config user.name "ink-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard_snapshot.json
          git diff --staged --quiet && exit 0
          git commit -m "recap: weekly $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
