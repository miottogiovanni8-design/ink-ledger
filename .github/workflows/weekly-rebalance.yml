name: Weekly rebalance

on:
  schedule:
    # 14:00 UTC Monday — after the US market opens (9:30 ET), before it's too busy
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

concurrency:
  # shared with daily-mark.yml — both write the same SQLite ledger and must
  # never run concurrently (binary file, no merge).
  group: ink-ledger-db
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run weekly rebalance
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ACTIVE_RISK_PROFILE: ${{ vars.ACTIVE_RISK_PROFILE }}
        run: python -m trading_desk.cli.weekly_rebalance

      - name: Commit updated ledger and snapshot
        run: |
          git config user.name "ink-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trading_desk.sqlite data/dashboard_snapshot.json
          git diff --staged --quiet && exit 0
          git commit -m "rebalance: weekly $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
