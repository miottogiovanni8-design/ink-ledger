name: Weekly rebalance

on:
  schedule:
    # 14:00 UTC Monday — after the US market opens (9:30 ET), before it's too busy
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

concurrency:
  # shared with daily-mark.yml — both write the same SQLite ledger and must
  # never run concurrently (binary file, no merge).
  group: ink-ledger-db
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Debug - test Alpaca credentials
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          echo "trading API (paper account endpoint):"
          curl -s -o /dev/null -w "  status: %{http_code}\n" \
            -H "APCA-API-KEY-ID: $ALPACA_API_KEY" -H "APCA-API-SECRET-KEY: $ALPACA_SECRET_KEY" \
            https://paper-api.alpaca.markets/v2/account
          echo "market data API (bars endpoint):"
          curl -s -o /dev/null -w "  status: %{http_code}\n" \
            -H "APCA-API-KEY-ID: $ALPACA_API_KEY" -H "APCA-API-SECRET-KEY: $ALPACA_SECRET_KEY" \
            "https://data.alpaca.markets/v2/stocks/bars?symbols=AAPL&timeframe=1Day&limit=1"

      - name: Run weekly rebalance
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ACTIVE_RISK_PROFILE: ${{ vars.ACTIVE_RISK_PROFILE }}
        run: python -m trading_desk.cli.weekly_rebalance

      - name: Commit updated ledger and snapshot
        run: |
          git config user.name "ink-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trading_desk.sqlite data/dashboard_snapshot.json
          git diff --staged --quiet && exit 0
          git commit -m "rebalance: weekly $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Check API spend and alert if over threshold
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEND_ALERT_THRESHOLD_USD: ${{ vars.SPEND_ALERT_THRESHOLD_USD }}
        run: |
          SPEND=$(python -c "import json; print(json.load(open('data/dashboard_snapshot.json'))['api_spend_month_to_date_usd'])")
          THRESHOLD="${SPEND_ALERT_THRESHOLD_USD:-1.99}"
          MONTH_TAG=$(date -u +%Y-%m)
          echo "month-to-date estimated Claude API spend: \$${SPEND} (alert threshold: \$${THRESHOLD})"
          OVER=$(python -c "print(1 if float('$SPEND') >= float('$THRESHOLD') else 0)")
          if [ "$OVER" = "1" ]; then
            EXISTING=$(gh issue list --search "\"Anthropic API spend alert — ${MONTH_TAG}\" in:title" --state open --json number --jq '.[0].number')
            if [ -z "$EXISTING" ]; then
              BODY="Estimated Claude API spend this month has reached \$${SPEND}, at or above the \$${THRESHOLD} alert threshold configured for this project (repo variable \`SPEND_ALERT_THRESHOLD_USD\`).\n\nThis is a **self-reported estimate** computed from the token usage of each weekly view call against public per-token pricing — it is not Anthropic's own billing figure. Check the actual number, and your hard spend cap, in the [Anthropic Console](https://console.anthropic.com/settings/billing).\n\nOne issue per calendar month while spend stays at or above the threshold — this won't duplicate on later runs within ${MONTH_TAG}."
              gh issue create --title "Anthropic API spend alert — ${MONTH_TAG}: \$${SPEND} this month" --body "$(printf '%b' "$BODY")"
            else
              echo "an open spend-alert issue already exists for ${MONTH_TAG} (#$EXISTING), not creating a duplicate"
            fi
          fi
