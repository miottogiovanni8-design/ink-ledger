[project]
name = "trading-desk"
version = "0.1.0"
description = "AI-driven paper trading desk — Finance + AI portfolio project"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "anthropic>=0.45",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "resend>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_desk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
